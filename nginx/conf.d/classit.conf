# classit.o-r.kr 리버스 프록시 + HTTPS
# - :80  → ACME(인증서 갱신) challenge 응답 + 나머지는 HTTPS 로 리다이렉트
# - :443 → app:8080 으로 프록시

server {
    listen 80;
    listen [::]:80;
    server_name classit.o-r.kr www.classit.o-r.kr;

    # Let's Encrypt 발급/갱신용 (webroot). certbot 이 이 경로에 파일을 놓고 nginx 가 응답.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 그 외 모든 HTTP 요청은 HTTPS 로 영구 리다이렉트
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name classit.o-r.kr www.classit.o-r.kr;

    ssl_certificate     /etc/letsencrypt/live/classit.o-r.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/classit.o-r.kr/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # 업로드 용량 (필요 시 조정)
    client_max_body_size 20m;

    location / {
        proxy_pass http://app:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket / keep-alive 대비
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
