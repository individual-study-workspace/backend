name: Github Actions 실행시켜보기

on:
  push:
    branches:
      - main

jobs:
  My-Deploy-job:
    runs-on: ubuntu-latest

    steps:
      - name: Github Repository 파일 불러오기
        uses: actions/checkout@v5

      - name: JDK 버전설치
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: prod 설정 파일 생성 (application-prod.yml — secret 없음, 값은 런타임 env 주입)
        run: cp ./src/main/resources/application-prod.yml.template ./src/main/resources/application-prod.yml

      - name: 테스트 및 빌드
        run: ./gradlew clean build

      - name: GitHub Actions Public IP 얻기
        id: ip
        run: echo "ipv4=$(curl -s https://checkip.amazonaws.com)" >> "$GITHUB_OUTPUT"

      - name: AWS Resource에 접근할 수 있게 AWS credentials 설정
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-region: ap-northeast-2
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}


      - name: GitHub Actions IP 추가
        run: |
          aws ec2 authorize-security-group-ingress \
              --group-id ${{ secrets.AWS_IAM_GITHUB_ACTIONS_SECURITY_GROUP_ID }} \
              --protocol tcp \
              --port 22 \
              --cidr ${{ steps.ip.outputs.ipv4 }}/32

      - name: ECR 로그인
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Docker 이미지 생성
        run: docker build -t classit-server .

      - name: Docker 이미지 Tag 붙이기
        run: docker tag classit-server ${{ steps.login-ecr.outputs.registry }}/classit-server:latest

      - name: ECR에 Docker 이미지 Push
        run: docker push ${{ steps.login-ecr.outputs.registry }}/classit-server:latest

      - name: docker-compose.prod.yml 을 EC2로 복사
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          source: docker-compose.prod.yml
          target: /home/ubuntu/classit

      - name: SSH로 EC2에 접속
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          script_stop: true
          script: |
            cd /home/ubuntu/classit
            export ECR_IMAGE=${{ steps.login-ecr.outputs.registry }}/classit-server:latest
            docker compose -f docker-compose.prod.yml pull app
            docker compose -f docker-compose.prod.yml up -d
            docker image prune -f

      - name: GitHub Actions IP 제거
        if: always() && steps.ip.outputs.ipv4 != ''
        run: |
          aws ec2 revoke-security-group-ingress \
              --region ap-northeast-2 \
              --group-id ${{ secrets.AWS_IAM_GITHUB_ACTIONS_SECURITY_GROUP_ID }} \
              --protocol tcp \
              --port 22 \
              --cidr ${{ steps.ip.outputs.ipv4 }}/32