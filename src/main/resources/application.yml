spring:
  application:
    name: tutoring
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080
  shutdown: graceful

spring.lifecycle.timeout-per-shutdown-phase: 30s

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    com.tutoring: DEBUG

app:
  jwt:
    secret: change-me-in-real-env-min-256-bits-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    access-token-validity-ms: 900000        # 15분
    refresh-token-validity-ms: 1209600000   # 14일
  cors:
    allowed-origins: ""
